name: Quality Check
on:
  workflow_call:
    inputs:
      # _SKIP*: sometimes you want to quickly test something, without having the whole suite kicking in.
      # This is a lazy way to switch on and off steps. But never set it to true in main.
      _SKIP_QUALITY:
        type: boolean
        default: false
        description: for debug purposes only - if true skip all quality checks.

jobs:
  builder:
    name: Quality Checks
    # Avoid duplicate runs: run on push (same-repo branches) OR on pull_request only if from a fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # Must be done before using composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history gives Sonar accurate new-code / blame info
          show-progress: false # very verbose for not much
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        # uv is needed for qa and deploy, so is kinda always needed. No need to skip it.
        with:
          activate-environment: true
          enable-cache: true
      - name: Install dependencies
        if: ${{ always() }}
        run: uv sync --frozen --no-install-project

      # Run quality checks
      - name: reuse
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe reuse
      - name: licensecheck
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe licensecheck --check
      - name: lint
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe lint --check
      - name: format
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe format --check
      - name: format-pyproject
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe format-pyproject --check
      - name: typing
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe type
      - name: typing tests
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe type-tests
      - name: tests
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe tests --relaxed
      - name: doctests
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe doctests --relaxed
      - name: notebooks-check
        if: ${{ ! inputs._SKIP_QUALITY && always() }}
        run: poe notebooks-check

      # Upload analysis + coverage.xml (produced by the tests step) to SonarCloud.
      # Skipped on fork PRs, which cannot access the SONAR_TOKEN secret.
      - name: SonarCloud scan
        if: ${{ ! inputs._SKIP_QUALITY && !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Stop if any quality step failed
        # All tests are run with always() not to stop on the first error. This step makes the workflow fail if any quality step failed.
        if: ${{ failure() }}
        run: exit 1

  tests:
    name: Build and tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ ! inputs._SKIP_QUALITY }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      # Windows currently has known platform-specific test failures; keep the
      # build/install coverage there and track the test failures separately.
      - name: tests
        if: runner.os != 'Windows'
        run: poe tests --relaxed
