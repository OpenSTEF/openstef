[project]
name = "openstef-docs"
version = "0.0.0"
description = "Open Short Term Energy forecasting library"
readme = "README.md"
keywords = [ "energy", "forecasting", "machinelearning" ]
license = "MPL-2.0"
authors = [
  { name = "Alliander N.V", email = "openstef@lfenergy.org" },
]
requires-python = ">=3.12,<4.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "huggingface-hub>=1.2.2",
  "ipython>=9.4",
  "jupyter-cache>=1",
  "jupytext>=1.16",
  # kaleido 1.4.0 serializes pandas Timestamp values in figure specs
  # (plotly/Kaleido#461), which is what kept us on the deprecated v0.2.x.
  # See OpenSTEF/openstef#938.
  "kaleido>=1.4",
  "matplotlib>=3.10.5",
  "myst-nb>=1.2",
  "openstef",
  "openstef-beam",
  "openstef-core",
  "openstef-foundation-models",
  "openstef-models",
  "optuna>=4.7",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.2.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-autodoc-typehints>=3.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinx-gallery>=0.19",
  "sphinx-prompt>=1.10",
  "sphinx-pyproject>=0.3",
  "sphinxcontrib-mermaid>=0.9.2",
]

[tool.setuptools]
packages = []

[tool.uv]
sources.openstef = { workspace = true }
sources.openstef-beam = { workspace = true }
sources.openstef-core = { workspace = true }
sources.openstef-foundation-models = { workspace = true }
sources.openstef-models = { workspace = true }
