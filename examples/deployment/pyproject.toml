[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "openstef-deployment-examples"
version = "0.0.0"
description = "Runnable deployment examples for OpenSTEF (Dagster, Airflow, Celery)"
readme = "README.md"
requires-python = ">=3.12,<4.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "openstef-core[benchmark]",
  "openstef-models[xgb-cpu]",
  "pydantic-settings>=2.14,<3",
]
optional-dependencies.airflow = [ "apache-airflow>=3.2,<4" ]
optional-dependencies.celery = [
  "celery[redis]>=5.4",
]
optional-dependencies.dagster = [
  "dagster>=1.9",
  "dagster-webserver>=1.9",
]

[tool.hatch]
build.targets.wheel.packages = [
  "src/airflow_app",
  "src/celery_app",
  "src/common",
  "src/dagster_app",
]

[tool.poe]
tasks.deploy-airflow-forecast.help = "Airflow (CLI): run the forecast DAG once (no scheduler)"
tasks.deploy-airflow-forecast.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-airflow-forecast.env.AIRFLOW_HOME = "${POE_ROOT}/examples/deployment/openstef_deployment_runs/airflow"
tasks.deploy-airflow-forecast.env.AIRFLOW__CORE__DAGS_FOLDER = "${POE_ROOT}/examples/deployment/src/airflow_app/dags"
tasks.deploy-airflow-forecast.env.AIRFLOW__CORE__LOAD_EXAMPLES = "False"
tasks.deploy-airflow-forecast.env.AIRFLOW__CORE__AUTH_MANAGER = "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
tasks.deploy-airflow-forecast.sequence = [
  { cmd = "uv run --no-sync --package openstef-deployment-examples airflow db migrate" },
  { cmd = "uv run --no-sync --package openstef-deployment-examples airflow dags test openstef_forecast 2024-04-15" },
]
tasks.deploy-airflow-train.help = "Airflow (CLI): run the training DAG once (no scheduler)"
tasks.deploy-airflow-train.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-airflow-train.env.AIRFLOW_HOME = "${POE_ROOT}/examples/deployment/openstef_deployment_runs/airflow"
tasks.deploy-airflow-train.env.AIRFLOW__CORE__DAGS_FOLDER = "${POE_ROOT}/examples/deployment/src/airflow_app/dags"
tasks.deploy-airflow-train.env.AIRFLOW__CORE__LOAD_EXAMPLES = "False"
tasks.deploy-airflow-train.env.AIRFLOW__CORE__AUTH_MANAGER = "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
tasks.deploy-airflow-train.sequence = [
  { cmd = "uv run --no-sync --package openstef-deployment-examples airflow db migrate" },
  { cmd = "uv run --no-sync --package openstef-deployment-examples airflow dags test openstef_train 2024-04-15" },
]
tasks.deploy-airflow-ui.help = "Airflow (UI): all-in-one webserver + scheduler at http://localhost:8080"
tasks.deploy-airflow-ui.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-airflow-ui.env.AIRFLOW_HOME = "${POE_ROOT}/examples/deployment/openstef_deployment_runs/airflow"
tasks.deploy-airflow-ui.env.AIRFLOW__CORE__DAGS_FOLDER = "${POE_ROOT}/examples/deployment/src/airflow_app/dags"
tasks.deploy-airflow-ui.env.AIRFLOW__CORE__LOAD_EXAMPLES = "False"
# Built-in simple auth manager, so the example does not require the Flask-AppBuilder provider.
tasks.deploy-airflow-ui.env.AIRFLOW__CORE__AUTH_MANAGER = "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
# macOS fork-safety: the dag-processor forks to parse DAGs; without this the forked child
# aborts on macOS, so DAGs never serialize and do not show up in the UI. No-op on Linux.
tasks.deploy-airflow-ui.env.OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"
tasks.deploy-airflow-ui.cmd = "uv run --no-sync --package openstef-deployment-examples airflow standalone"
tasks.deploy-celery-forecast.help = "Celery (CLI): forecast every target (eager, in-process, no broker)"
tasks.deploy-celery-forecast.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-celery-forecast.cmd = "uv run --no-sync --package openstef-deployment-examples python -m celery_app.run forecast"
tasks.deploy-celery-train.help = "Celery (CLI): train every target (eager, in-process, no broker)"
tasks.deploy-celery-train.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-celery-train.cmd = "uv run --no-sync --package openstef-deployment-examples python -m celery_app.run train"
tasks.deploy-dagster-forecast.help = "Dagster (CLI): forecast every target (materialize the forecast asset)"
tasks.deploy-dagster-forecast.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-dagster-forecast.cmd = "uv run --no-sync --package openstef-deployment-examples python -m dagster_app.run forecast"
tasks.deploy-dagster-train.help = "Dagster (CLI): train every target (materialize the trained_model asset)"
tasks.deploy-dagster-train.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-dagster-train.cmd = "uv run --no-sync --package openstef-deployment-examples python -m dagster_app.run train"
# Run-the-example tasks, co-located with the example. The root pyproject pulls these in via
# `[tool.poe] include`, so `uv run poe deploy-*` works from the repo root (where POE_ROOT,
# and therefore the paths below, resolve). Each framework has the same three commands:
# `-ui` (launch the web UI), `-train`, and `-forecast`.
tasks.deploy-dagster-ui.help = "Dagster (UI): the Dagster web UI at http://localhost:3000"
tasks.deploy-dagster-ui.env.OPENSTEF_DEPLOY_DATA_DIR = "${POE_ROOT}/examples/deployment/openstef_deployment_runs"
tasks.deploy-dagster-ui.cmd = "uv run --no-sync --package openstef-deployment-examples dagster dev -m dagster_app.definitions"
