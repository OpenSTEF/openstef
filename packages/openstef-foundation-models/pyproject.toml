[build-system]
build-backend = "hatchling.build"

requires = [ "hatchling" ]

[project]
name = "openstef-foundation-models"
version = "0.0.0"
description = "Foundation model support for OpenSTEF"
readme = "README.md"
keywords = [ "energy", "forecasting", "foundationmodels", "machinelearning", "onnx" ]
license = "MPL-2.0"
authors = [
  { name = "Alliander N.V", email = "openstef@lfenergy.org" },
]
requires-python = ">=3.12,<4.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "openstef-core>=4.0.0.dev0,<5",
  "openstef-models>=4.0.0.dev0,<5",
]

# Exactly one of [cpu] or [gpu] must be installed — they are declared as
# conflicting extras so uv will refuse to resolve both simultaneously.
optional-dependencies.cpu = [
  "onnxruntime>=1.20",
]
optional-dependencies.gpu = [
  "onnxruntime-gpu>=1.20",
]
# Resolve checkpoints from the HuggingFace Hub (local paths need no extra).
optional-dependencies.hub = [
  "huggingface-hub>=1.2.2",
]
# Run the original Chronos-2 Torch module (benchmarking / ONNX parity reference).
optional-dependencies.torch = [
  "chronos-forecasting>=2",
  "torch>=2.4",
]
# Backtest/benchmark foundation-model forecasters through openstef-beam.
optional-dependencies.benchmarking = [
  "openstef-beam>=4.0.0.dev0,<5",
]

urls.Documentation = "https://openstef.github.io/openstef/index.html"
urls.Homepage = "https://lfenergy.org/projects/openstef/"
urls.Issues = "https://github.com/OpenSTEF/openstef/issues"
urls.Repository = "https://github.com/OpenSTEF/openstef"

[tool.hatch.build.targets.wheel]
packages = [ "src/openstef_foundation_models" ]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.uv.sources]
openstef-core = { workspace = true }
openstef-models = { workspace = true }
openstef-beam = { workspace = true }
